name: Validate international Daily World news
on:
  push:
    branches: [daily-world-international-check]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 -B -m unittest scripts.test_update_news
      - run: bash scripts/setup_news_translation.sh
        continue-on-error: true
      - run: python3 scripts/update_news.py --require-fresh
      - run: |
          python3 - <<'PY'
          import json
          d=json.load(open("public/news.json"))
          assert 5 <= len(d["items"]) <= 8
          assert all(i["titleEn"] and i["url"].startswith("https://") for i in d["items"])
          print(d["updatedAt"], {i["source"] for i in d["items"]}, "translated:", sum("titleZh" in i for i in d["items"]), "total:", len(d["items"]))
          PY
      - run: npm ci && npm test && npm run build -- --base=/cloudhaven/
      - run: cmp public/news.json dist/news.json
      - uses: actions/upload-artifact@v4
        with:
          name: international-news-check
          path: public/news.json
