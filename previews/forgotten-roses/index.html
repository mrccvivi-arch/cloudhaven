<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>玫瑰习作 · 被时间遗忘的地方</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header>
      <span class="brand">Cloudhaven · 被时间遗忘的地方</span>
      <h1>玫瑰习作</h1>
    </header>
    <section class="stage" aria-label="玫瑰三维预览">
      <canvas id="preview" aria-label="拖动旋转，双指捏合缩放"></canvas>
      <p id="status" role="status" hidden></p>
      <div class="view-controls">
        <span>拖动旋转 · 双指或滚轮缩放</span>
        <button id="reset" type="button">复位视角</button>
      </div>
    </section>
    <aside aria-label="玫瑰与视角">
      <h2>玫瑰版本</h2>
      <div class="versions">
        <button type="button" data-version="0" aria-pressed="false"><span>R1</span> 午夜玫瑰</button>
        <button type="button" data-version="1" aria-pressed="false"><span>R2</span> 古典玫瑰</button>
        <button type="button" data-version="2" aria-pressed="false"><span>R3</span> 凋零玫瑰</button>
        <button type="button" data-version="3" aria-pressed="false">小型玫瑰组合</button>
        <button type="button" data-version="4" aria-pressed="false"><span>R4</span> 午夜残香</button>
        <button type="button" data-version="5" aria-pressed="false"><span>R4</span> 午夜残香 · 凋零</button>
        <button type="button" data-version="6" aria-pressed="false"><span>R4</span> 三尺度组合</button>
        <button type="button" data-version="7" aria-pressed="true"><span>R5</span> 油画玫瑰</button>
        <button type="button" data-version="8" aria-pressed="false"><span>R5</span> 油画玫瑰园</button>
      </div>
      <p id="description" aria-live="polite"></p>
      <h2 class="view-heading">观察视角</h2>
      <div class="views">
        <button type="button" data-view="portrait">整体</button>
        <button type="button" data-view="heart">花心</button>
        <button type="button" data-view="side">侧面</button>
      </div>
    </aside>
  </main>
  <script type="module" src="./preview.js"></script>
</body>
</html>
