<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7eddb">
  <title>Cloudhaven</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main id="game" aria-label="Cloudhaven">
    <canvas id="view" aria-label="棉花糖所在的三维世界"></canvas>
    <div class="top-bar">
      <h1>Cloudhaven</h1>
      <div class="top-actions">
        <button id="settings-toggle" type="button" aria-label="设置">设置</button>
        <button id="bag-toggle" type="button"><span aria-hidden="true">◫</span> 背包</button>
      </div>
    </div>
    <aside id="minimap" class="minimap" aria-label="小地图" hidden>
      <div class="minimap-view">
        <canvas width="240" height="240" aria-hidden="true"></canvas>
        <span class="minimap-north" aria-hidden="true">北</span>
        <span class="minimap-marker" aria-hidden="true"></span>
        <span class="minimap-label"></span>
        <div class="minimap-facilities"></div>
        <span id="minimap-facility-name" class="minimap-facility-name" role="status" hidden></span>
      </div>
    </aside>
    <aside id="region-panel" class="region" aria-label="游戏信息" data-mode="compact" hidden>
      <div class="region-strip">
        <div class="region-summary">
          <div id="world-time" class="world-time" data-phase="day" role="group" aria-label="游戏时间" hidden>
            <span id="world-phase-icon" class="world-phase-icon" aria-hidden="true">☀</span>
            <strong id="world-phase">白天</strong>
            <span id="world-clock">09:00</span>
          </div>
          <div id="moonlight-hud" class="moonlight-meter" role="group" aria-label="月光能量" hidden>
            <label for="moonlight-energy">月光能量</label>
            <progress id="moonlight-energy" max="100" value="100">100%</progress>
            <span id="moonlight-percent">100%</span>
          </div>
        </div>
        <button id="region-toggle" class="region-button" type="button" aria-label="展开游戏信息" aria-expanded="false" aria-controls="region-details">
          <span aria-hidden="true">⌄</span>
        </button>
        <button id="region-hide" class="region-button" type="button" aria-label="隐藏游戏信息" title="隐藏游戏信息">
          <span aria-hidden="true">−</span>
        </button>
      </div>
      <div id="region-details" hidden>
        <p id="region-name">云朵小屋</p>
        <p id="destination">沿小路向森林出发。</p>
      </div>
      <button id="region-show" class="region-button" type="button" aria-label="显示游戏状态栏" title="显示游戏状态栏" hidden>
        <span aria-hidden="true">ⓘ</span>
      </button>
    </aside>
    <div id="companion-bubble" class="companion-bubble" hidden>
      <p role="status"></p>
    </div>
    <p id="feedback" class="feedback" role="status"></p>
    <div id="joystick" class="joystick" aria-hidden="true"><span></span></div>
    <div class="actions">
      <button id="interact" type="button" hidden></button>
      <button id="jump" type="button" aria-label="跳跃">↑ <span>Jump</span></button>
    </div>
    <p class="control-hint">摇杆移动 · 拖动右侧转镜头</p>
    <p class="control-hint desktop">WASD / 方向键 · 拖动转镜头 · Space 跳跃 · E 互动</p>
    <dialog id="bag" aria-labelledby="bag-title">
      <div class="bag-heading">
        <h2 id="bag-title">棉花糖的背包</h2>
        <button id="bag-close" type="button" aria-label="关闭背包">×</button>
      </div>
      <ul id="inventory"></ul>
      <p id="discovery"></p>
      <section id="affection-info" class="affection-info" aria-labelledby="affection-title">
        <h3 id="affection-title">与月的关系</h3>
        <strong id="affection-rank"></strong>
        <p id="affection-points"></p>
        <progress id="affection-progress" aria-label="好感度升级进度" max="100" value="0"></progress>
        <p id="affection-next"></p>
      </section>
    </dialog>
    <dialog id="chest" aria-labelledby="chest-title">
      <div class="bag-heading">
        <h2 id="chest-title">星月宝箱</h2>
        <button id="chest-close" type="button" aria-label="关闭星月宝箱">×</button>
      </div>
      <ul id="chest-items"></ul>
    </dialog>
    <dialog id="settings" aria-labelledby="settings-title">
      <div class="bag-heading">
        <h2 id="settings-title">设置</h2>
        <button id="settings-close" type="button">关闭</button>
      </div>
      <label class="sound-setting"><span>音效</span><input id="sound-enabled" type="checkbox" checked></label>
      <label class="sound-setting"><span>音效音量</span><input id="sound-volume" type="range" min="0" max="100" value="65"></label>
    </dialog>
    <dialog id="piano" class="piano" aria-labelledby="piano-title">
      <div class="piano-heading">
        <h2 id="piano-title">月光水晶琴</h2>
        <button id="piano-exit" type="button">退出</button>
      </div>
      <div class="piano-modes">
        <button id="piano-free" type="button" aria-pressed="true">自由演奏</button>
        <button id="piano-challenge" type="button" aria-pressed="false">旋律挑战</button>
      </div>
      <div class="piano-challenge-options" hidden>
        <label for="piano-level">关卡</label>
        <select id="piano-level">
          <option value="0">第 1 关</option>
          <option value="1">第 2 关</option>
          <option value="2">第 3 关</option>
        </select>
        <button id="piano-replay" type="button">重听旋律</button>
      </div>
      <p id="piano-status" role="status"></p>
      <div class="piano-keys" role="group" aria-label="水晶琴琴键"></div>
      <div class="piano-stars" aria-hidden="true" hidden><span>✦</span><span>✧</span><span>✦</span></div>
    </dialog>
    <div id="failure" class="failure" role="status" hidden>
      <div>
        <h2 id="failure-title">暂时无法打开 3D 世界</h2>
        <p id="failure-text">请试试支持 WebGL 2 的浏览器，或在更新 Safari 后重新打开。</p>
        <button id="retry" type="button">重新加载</button>
      </div>
    </div>
  </main>
  <script>
    document.querySelector("#retry").addEventListener("click", function () { location.reload(); });
    window.cloudhavenBootFailed = function () {
      document.querySelector("#failure-title").textContent = "Cloudhaven 暂时未能加载";
      document.querySelector("#failure-text").textContent = "请刷新页面。若问题仍在，请确认网站发布的是 Cloudhaven 的构建版本。";
      document.querySelector("#failure").hidden = false;
    };
    window.addEventListener("error", function (event) {
      if (event.target && event.target.tagName === "SCRIPT" && event.target.type === "module") window.cloudhavenBootFailed();
    }, true);
  </script>
  <script type="module">
    import("./src/main.js").then(({ start }) => start()).catch((error) => {
      console.error(error);
      window.cloudhavenBootFailed();
    });
  </script>
</body>
</html>
